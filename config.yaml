# =====================================================================
#  CONFIGURATION DE LA VEILLE DE STAGES
#  Tu peux modifier ce fichier directement sur GitHub (icône crayon).
#  Règles : garder l'indentation (2 espaces), pas de tabulation.
# =====================================================================

# ---------------------------------------------------------------------
# 1. TA RECHERCHE
# ---------------------------------------------------------------------
recherche:
  # Postes recherchés (valeurs possibles : Sales, Trading, Structuring,
  # Risk, Middle Office, Markets (général), Quant/Research)
  postes_voulus: [Sales, Trading, Structuring, Risk, Middle Office, "Markets (général)"]

  # Période de disponibilité : le stage doit tenir entre ces deux dates
  disponible_du: "2027-05-01"
  disponible_au: "2027-12-31"
  duree_mois: 6

  # Villes ciblées (les variantes sont reconnues : La Défense -> Paris, etc.)
  villes: [Paris, Lyon, Lille, Montréal, Toronto, Londres, New York, Chicago,
           Milan, Zurich, Genève, Luxembourg, Amsterdam]

  # Garder aussi les offres d'entreprises absentes de ta liste,
  # si l'intitulé est clairement un poste de marchés (ex. CACEIS, Amundi...)
  inclure_autres_entreprises: true

  # Exclure les contrats qui ne sont pas des stages
  exclure_mots: [alternance, apprentissage, apprenti, apprentice, "v.i.e", " vie ",
                 graduate programme, graduate program, cdi, "working student",
                 werkstudent, "part-time", "temps partiel", "summer associate"]

# ---------------------------------------------------------------------
# 2. NOTIFICATIONS (ntfy)
#    Le nom du sujet ntfy est stocké dans les "Secrets" GitHub (NTFY_TOPIC),
#    jamais ici, car ce fichier peut être public.
# ---------------------------------------------------------------------
notifications:
  actif: true
  serveur: "https://ntfy.sh"
  # Notifier aussi les offres dont la période semble incompatible ?
  notifier_periode_incompatible: false
  # Au-delà de ce nombre d'offres dans un même passage, une notification
  # récapitulative est envoyée au lieu d'une par offre
  max_notifications_par_passage: 8
  # Adresse de ton dashboard (pour le lien dans les notifications récapitulatives)
  url_dashboard: ""

# ---------------------------------------------------------------------
# 3. DÉDOUBLONNAGE
# ---------------------------------------------------------------------
dedoublonnage:
  # Similarité minimale des intitulés (0-100) pour considérer 2 offres identiques
  seuil_similarite_titre: 86
  # Une offre réapparue après N jours d'absence = "repost tardif" (désistement)
  jours_absence_repost: 14
  # En dessous de ce taux de similarité des descriptions = "mise à jour importante"
  seuil_changement_description: 0.70
  # Une offre non revue depuis N jours est considérée comme expirée
  jours_avant_expiration: 10

# ---------------------------------------------------------------------
# 4. ANALYSE DE COMPATIBILITÉ CV (module IA, désactivé pour l'instant)
#    Pour l'activer : voir le guide, section "Activer l'analyse IA".
# ---------------------------------------------------------------------
analyse_ia:
  actif: false
  modele: "claude-haiku-5-5"
  # N'analyser que les offres pertinentes (poste + ville + période OK)
  seulement_offres_pertinentes: true
  max_analyses_par_passage: 25

# ---------------------------------------------------------------------
# 5. SOURCES
#    "toutes_les_minutes" : intervalle minimal entre 2 collectes d'une source.
# ---------------------------------------------------------------------
sources:
  workday:
    actif: true
    toutes_les_minutes: 30
    # Recherches envoyées à chaque site (les résultats sont ensuite filtrés par l'outil)
    recherches: ["markets intern", "sales trading intern", "off-cycle internship", "risk intern",
                 "middle office intern", "trading internship", "stage", "stagiaire"]
    sites:
      - {entreprise: "Citi (Citigroup)", url: "https://citi.wd5.myworkdayjobs.com/2"}
      - {entreprise: "Morgan Stanley", url: "https://ms.wd5.myworkdayjobs.com/External"}
      - {entreprise: "Wells Fargo", url: "https://wf.wd1.myworkdayjobs.com/WellsFargoJobs"}
      - {entreprise: "State Street", url: "https://statestreet.wd1.myworkdayjobs.com/Global"}
      - {entreprise: "BMO Capital Markets", url: "https://bmo.wd3.myworkdayjobs.com/External"}
      - {entreprise: "TD Securities (incl. Cowen)", url: "https://td.wd3.myworkdayjobs.com/TD_Bank_Careers"}
      - {entreprise: "Santander CIB", url: "https://santander.wd3.myworkdayjobs.com/SantanderCareers"}
      - {entreprise: "RBC Capital Markets", url: "https://rbc.wd3.myworkdayjobs.com/RBCGLOBAL1"}
      - {entreprise: "MUFG", url: "https://mufgub.wd3.myworkdayjobs.com/MUFG-Careers"}
      - {entreprise: "Mizuho", url: "https://mizuho.wd1.myworkdayjobs.com/mizuhoamericas"}
      - {entreprise: "Millennium", url: "https://mlp.wd5.myworkdayjobs.com/mlpcareers"}

  oracle:
    actif: true
    toutes_les_minutes: 30
    recherches: ["off-cycle", "internship", "markets internship", "stage"]
    sites:
      - {entreprise: "J.P. Morgan", hote: "https://jpmc.fa.oraclecloud.com", site: "CX_1001"}

  greenhouse:
    actif: true
    toutes_les_minutes: 60
    tableaux:
      - {entreprise: "Jane Street", jeton: "janestreet"}
      - {entreprise: "IMC", jeton: "imc"}
      - {entreprise: "DRW", jeton: "drweng"}
      - {entreprise: "Jump Trading", jeton: "jumptrading"}
      - {entreprise: "Hudson River Trading (HRT)", jeton: "wehrtyou"}
      - {entreprise: "Tower Research Capital", jeton: "towerresearchcapital"}
      - {entreprise: "XTX Markets", jeton: "xtxmarketstechnologies"}
      - {entreprise: "Qube Research & Technologies (QRT)", jeton: "quberesearchandtechnologies"}
      - {entreprise: "Point72", jeton: "point72"}
      - {entreprise: "AQR", jeton: "aqr"}
      - {entreprise: "Flow Traders", jeton: "flowtraders"}
      - {entreprise: "GSA Capital", jeton: "gsacapital"}
      - {entreprise: "Marshall Wace", jeton: "marshallwace"}

  smartrecruiters:
    actif: true
    toutes_les_minutes: 60
    entreprises:
      - {entreprise: "Vitol", identifiant: "vitol"}
      - {entreprise: "TP ICAP", identifiant: "tpicap"}
      - {entreprise: "Tradition (Comp. Financière Tradition)", identifiant: "tradition"}

  bnp:
    actif: true
    toutes_les_minutes: 30
    # Filtres du site BNP : type 28 = Stage ; entité 94 = CIB ; 96 = Asset Management
    url: "https://group.bnpparibas/emploi-carriere/toutes-offres-emploi?form%5Btype%5D%5B%5D=28&form%5Brh_entity%5D%5B%5D=94"
    pages_max: 12

  linkedin:
    # Recherche d'offres publique de LinkedIn (sans compte). Couvre toutes les
    # entreprises de la liste, y compris celles sans connecteur direct.
    actif: true
    toutes_les_minutes: 90
    recherches: ["stage sales trading", "stage marchés financiers", "stage risques de marché",
                 "stage middle office", "off-cycle internship markets",
                 "sales trading internship", "markets internship", "risk internship"]
    lieux: ["Paris, Île-de-France, France", "Lyon, Auvergne-Rhône-Alpes, France",
            "Lille, Hauts-de-France, France", "Montreal, Quebec, Canada", "Toronto, Ontario, Canada",
            "London, England, United Kingdom", "New York, United States", "Chicago, Illinois, United States",
            "Milan, Lombardy, Italy", "Zurich, Switzerland", "Geneva, Switzerland",
            "Luxembourg", "Amsterdam, North Holland, Netherlands"]
    # Recherches complètes sur Paris, recherches réduites (2 premières) ailleurs
    recherches_hors_paris: 3
    pages_par_recherche: 2
    pause_secondes: 2.5

